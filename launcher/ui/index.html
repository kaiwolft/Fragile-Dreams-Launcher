<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fragile Dreams</title>
<style>
@font-face{font-family:"FD Cinzel";src:url(fonts/Cinzel.ttf) format("truetype");font-weight:400 900}
@font-face{font-family:"FD Cormorant";src:url(fonts/CormorantGaramond.ttf) format("truetype");font-weight:300 700}
@font-face{font-family:"FD Cormorant";src:url(fonts/CormorantGaramond-Italic.ttf) format("truetype");font-weight:300 700;font-style:italic}
:root{
  --night:#050a18; --deep:#0a1630; --ink:#e8f0fb; --mute:#8fa3c0; --dim:#5d6f8c;
  --glow:#8fd2ff; --glow-2:#4aa8ff; --lilac:#c9b2ff; --line:rgba(160,205,255,.28);
  --glass:rgba(8,18,40,.72); --glass-2:rgba(14,30,62,.55);
  --display:"FD Cinzel","Cinzel",Georgia,serif; --body:"FD Cormorant","Cormorant Garamond",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--body);user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#02050d}
#stage{position:relative;width:1280px;height:720px;flex:none;overflow:hidden;transform-origin:center center;background:var(--night)}
#dragbar{position:fixed;left:0;right:0;top:0;height:30px;-webkit-app-region:drag;z-index:50}
body.full #dragbar{display:none}

/* ── fondo ───────────────────────────── */
#bg{position:absolute;left:0;top:0;width:1334px;height:751px;background:url(assets/bg.jpg) left top/100% 100% no-repeat;transform-origin:0 0;opacity:0;transition:opacity 1.6s ease}
body.ready #bg{opacity:1}
#bg canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
body.anim #bg{animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.03) translate(0,-8px)}}
#shimmer{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:.0;transition:opacity 2s ease;
  background:radial-gradient(ellipse 22% 9% at 74% 47%,rgba(150,215,255,.20),transparent 70%),
             radial-gradient(ellipse 18% 6% at 90% 58%,rgba(150,215,255,.16),transparent 70%),
             radial-gradient(ellipse 14% 5% at 60% 66%,rgba(190,170,255,.12),transparent 70%)}
body.ready.anim #shimmer{opacity:1;animation:shim 6s ease-in-out infinite alternate}
@keyframes shim{from{filter:brightness(.7);transform:translateX(-6px)}to{filter:brightness(1.25);transform:translateX(8px)}}
#shade{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 52% 62% at 10% 80%,rgba(3,8,20,.9) 0%,rgba(3,8,20,.62) 50%,rgba(3,8,20,0) 100%),
             linear-gradient(0deg,rgba(2,6,16,.85) 0%,rgba(2,6,16,0) 16%)}
body.inpanel #shade{background:radial-gradient(ellipse 52% 62% at 10% 80%,rgba(3,8,20,.9) 0%,rgba(3,8,20,.62) 50%,rgba(3,8,20,0) 100%),
             linear-gradient(90deg,rgba(3,8,20,0) 40%,rgba(3,8,20,.55) 60%),linear-gradient(0deg,rgba(2,6,16,.85) 0%,rgba(2,6,16,0) 16%)}
#shade{transition:background .5s ease}
#fx{position:absolute;inset:0;pointer-events:none}
#logoGlow{position:absolute;left:30px;top:70px;width:520px;height:290px;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background:radial-gradient(ellipse 50% 45% at 50% 48%,rgba(140,205,255,.20),transparent 70%)}
body.ready.anim #logoGlow{animation:breathe 5.5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.85}}

/* ── barra superior ─────────────────── */
#top{position:absolute;right:16px;top:12px;display:flex;gap:6px;z-index:60}
body.full #top{display:none}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;color:var(--mute);border:1px solid transparent;border-radius:50%;transition:all .2s;-webkit-app-region:no-drag}
.iconbtn.sel{transform:scale(1.12)}
.iconbtn:hover,.iconbtn.sel{color:var(--ink);border-color:var(--line);background:rgba(120,180,255,.08);box-shadow:0 0 14px rgba(120,190,255,.25)}
.iconbtn.off{opacity:.45}

/* ── menú principal ─────────────────── */
#menu{position:absolute;left:46px;top:312px;width:470px}
.mi{position:relative;display:flex;align-items:center;height:52px;padding-left:124px;opacity:0;transform:translateX(-16px)}
body.ready .mi{opacity:1;transform:none;transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.mi .lbl{font-family:var(--display);font-size:20px;letter-spacing:6px;color:var(--ink);text-shadow:0 0 18px rgba(120,180,255,.25);transition:all .25s}
.mi .orn{position:absolute;left:40px;top:50%;width:70px;height:12px;transform:translateY(-50%);transition:opacity .25s}
.mi .band{position:absolute;left:0;right:0;top:4px;bottom:4px;opacity:0;transition:opacity .3s ease;pointer-events:none}
.mi .band::before{content:"";position:absolute;left:30px;right:6px;top:0;bottom:0;border-radius:60% 10px 10px 60%/50% 10px 10px 50%;
  background:linear-gradient(90deg,rgba(40,120,220,.0) 0%,rgba(40,130,230,.42) 18%,rgba(25,90,190,.30) 70%,rgba(20,70,160,0) 100%);
  border-top:1px solid rgba(160,220,255,.55);border-bottom:1px solid rgba(160,220,255,.75);box-shadow:0 0 24px rgba(80,170,255,.35),inset 0 0 30px rgba(120,200,255,.18)}
.mi .band::after{content:"";position:absolute;left:30px;right:6px;top:0;bottom:0;border-radius:inherit;
  background:linear-gradient(100deg,transparent 35%,rgba(200,235,255,.28) 50%,transparent 65%);background-size:260% 100%;animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{from{background-position:130% 0}to{background-position:-130% 0}}
.mi .lotus{position:absolute;left:40px;top:50%;width:62px;height:auto;transform:translateY(-52%) scale(.7);opacity:0;transition:all .35s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 8px rgba(150,215,255,.9))}
.mi.sel .band{opacity:1}
.mi.sel .lotus{opacity:1;transform:translateY(-52%) scale(1)}
.mi.sel .orn{opacity:0}
.mi.sel .lbl{color:#fff;text-shadow:0 0 14px rgba(170,225,255,.9),0 0 34px rgba(90,170,255,.6)}
body.anim .mi.sel .lotus{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(-52%) scale(1)}50%{transform:translateY(-58%) scale(1.03)}}
body.inpanel .mi:not(.sel) .lbl{color:var(--dim)}
body.inpanel .mi.sel .band::before{background:linear-gradient(90deg,rgba(40,120,220,0) 0%,rgba(40,130,230,.22) 18%,rgba(25,90,190,.12) 70%,rgba(20,70,160,0) 100%)}
#desc{position:absolute;left:170px;top:630px;width:440px;font-size:18px;font-style:italic;color:var(--mute);opacity:0;transition:opacity .4s}
body.ready #desc{opacity:1}

/* ── pie ───────────────────────────── */
#foot{position:absolute;left:52px;right:52px;bottom:16px;height:34px;display:flex;align-items:center;gap:22px;font-family:var(--display);font-size:12px;letter-spacing:2.5px;color:#c9d8ec;opacity:0;transition:opacity 1s ease .4s}
body.ready #foot{opacity:1}
#foot::before{content:"";position:absolute;left:-12px;right:-12px;top:-6px;height:1px;background:linear-gradient(90deg,rgba(160,210,255,.0),rgba(160,210,255,.55) 12%,rgba(160,210,255,.35) 70%,rgba(160,210,255,0))}
#foot .sep{color:var(--glow);font-size:13px}
#foot .ok{color:var(--glow)} #foot .warn{color:#ffb4a8}
#foot .sp{flex:1}
#foot .time{color:var(--mute)}
#foot .time b{color:var(--ink);font-weight:400;margin-left:8px}

/* ── paneles ───────────────────────── */
.panel{position:absolute;right:46px;top:64px;bottom:72px;width:610px;padding:26px 30px 22px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid var(--line);border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(10,20,40,.6),inset 0 0 60px rgba(70,140,230,.08);
  opacity:0;transform:translateX(28px);pointer-events:none;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.panel.on{opacity:1;transform:none;pointer-events:auto}
.panel::before,.panel::after{content:"";position:absolute;width:26px;height:26px;border:1px solid rgba(170,220,255,.6);pointer-events:none}
.panel::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
.panel::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.phead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.phead h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:8px;color:#fff;text-shadow:0 0 18px rgba(120,190,255,.5)}
.phead .sp{flex:1}
.phead .lot{width:34px;filter:drop-shadow(0 0 6px rgba(150,215,255,.8))}
.pbtn{height:34px;padding:0 16px;font-family:var(--display);font-size:12px;letter-spacing:3px;color:var(--ink);border:1px solid var(--line);background:rgba(120,180,255,.06);border-radius:2px;transition:all .2s;display:inline-flex;align-items:center;gap:8px}
.pbtn:hover,.pbtn.sel{border-color:rgba(170,225,255,.9);background:rgba(80,160,255,.22);box-shadow:0 0 16px rgba(90,180,255,.35)}
.glyph{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;border:1px solid rgba(200,230,255,.6);font-family:var(--display);font-size:10px;letter-spacing:0;color:#fff}
.tabs{display:flex;align-items:center;gap:2px;margin:0 0 12px;border-bottom:1px solid var(--line);overflow:hidden}
.tab{position:relative;flex:1 1 auto;padding:8px 6px 10px;font-family:var(--display);font-size:11.5px;letter-spacing:1.8px;color:var(--mute);transition:color .2s;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:#fff}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--glow),transparent);box-shadow:0 0 10px var(--glow)}
.tabkey{flex:none;display:inline-grid;place-items:center;min-width:26px;height:20px;padding:0 6px;margin:0 2px 4px;border-radius:10px;font-family:var(--display);font-size:9.5px;letter-spacing:.5px;color:#dcecff;background:rgba(120,180,255,.16);border:1px solid rgba(170,215,255,.35)}
.rows{flex:1;overflow:auto;padding-right:6px;scrollbar-width:thin;scrollbar-color:rgba(140,190,255,.35) transparent}
.rows::-webkit-scrollbar{width:6px}.rows::-webkit-scrollbar-thumb{background:rgba(140,190,255,.3);border-radius:3px}
.grp{margin:14px 2px 6px;font-family:var(--display);font-size:11px;letter-spacing:4px;color:var(--glow);opacity:.85}
.grp:first-child{margin-top:2px}
.row{display:flex;align-items:center;gap:14px;min-height:50px;padding:6px 12px;border:1px solid transparent;border-radius:2px;transition:background .18s,border-color .18s;animation:rowIn .35s ease both}
.rows.still .row{animation:none}
@keyframes rowIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.row.sel{background:linear-gradient(90deg,rgba(70,150,240,.22),rgba(70,150,240,.06));border-color:rgba(150,210,255,.45)}
.row .lab{flex:1;min-width:0}
.row .lab b{display:block;font-family:var(--display);font-weight:400;font-size:14px;letter-spacing:2.2px;color:var(--ink)}
.row .lab i{display:block;font-size:15px;color:var(--mute);margin-top:1px}
.opts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.opt{min-width:58px;height:30px;padding:0 10px;font-family:var(--display);font-size:11.5px;letter-spacing:1.6px;color:var(--mute);border:1px solid rgba(140,180,230,.25);border-radius:2px;transition:all .18s}
.opt:hover{color:var(--ink);border-color:rgba(170,215,255,.6)}
.opt.on{color:#fff;border-color:rgba(170,225,255,.9);background:linear-gradient(180deg,rgba(80,160,255,.45),rgba(40,100,200,.35));box-shadow:0 0 12px rgba(90,180,255,.35)}
.slider{display:flex;align-items:center;gap:10px;width:250px}
.track{position:relative;flex:1;height:8px;border:1px solid rgba(150,200,255,.35);border-radius:4px;background:rgba(120,170,230,.08);cursor:pointer}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#2a6fd0,var(--glow))}
.knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;transform:rotate(45deg);background:#eaf6ff;box-shadow:0 0 10px rgba(150,215,255,.9)}
.pct{width:44px;text-align:right;font-family:var(--display);font-size:12px;color:var(--ink)}
.bind{min-width:150px;height:32px;padding:0 12px;font-family:var(--display);font-size:11.5px;letter-spacing:1.5px;color:var(--ink);border:1px solid rgba(140,180,230,.35);border-radius:2px;background:rgba(10,20,40,.4);transition:all .18s}
.bind:hover{border-color:rgba(170,215,255,.8)}
.bind.live{border-color:var(--lilac);color:var(--lilac);box-shadow:0 0 14px rgba(200,170,255,.45);animation:pulse 1s ease-in-out infinite}
.bind.none{color:var(--dim)}
@keyframes pulse{50%{opacity:.55}}
.info{max-width:330px;text-align:right;font-size:16px;color:var(--mute)}
.pnote{margin-top:10px;font-size:15px;font-style:italic;color:var(--mute);text-align:center}
.big{align-self:center;margin-top:16px;min-width:300px;height:56px;font-family:var(--display);font-size:20px;letter-spacing:8px;color:#fff;border:1px solid rgba(170,225,255,.7);border-radius:2px;
  background:linear-gradient(180deg,rgba(60,140,240,.5),rgba(25,70,170,.45));box-shadow:0 0 22px rgba(80,170,255,.35);position:relative;overflow:hidden;transition:all .2s}
.big::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(220,240,255,.35) 50%,transparent 65%);background-size:260% 100%;animation:sheen 2.6s ease-in-out infinite}
.big:hover,.big.sel{box-shadow:0 0 0 1px rgba(200,235,255,.9),0 0 34px rgba(110,190,255,.6);transform:translateY(-1px)}
#playSum{margin:12px 0 0;padding:14px 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(60,130,230,.08),rgba(60,130,230,0))}
#playSum h4{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:11px;letter-spacing:4px;color:var(--glow)}
#playSum ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr auto;gap:5px 14px;font-size:17px;color:#d6e2f3}
#playSum li{display:contents}
#playSum li span:last-child{font-family:var(--display);font-size:12px;letter-spacing:2px;color:#fff;text-align:right}
.warnbox{margin:8px 0 0;padding:10px 14px;border:1px solid rgba(255,170,160,.45);background:rgba(120,30,30,.25);font-size:16px;color:#ffd2cb}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 18px;font-size:17px}
.kv span:nth-child(odd){color:var(--mute)} .kv span:nth-child(even){font-family:var(--display);font-size:13px;letter-spacing:1.5px;color:var(--ink);text-align:right}
.tips{margin:0;padding:0 0 0 18px;font-size:17.5px;line-height:1.45;color:#d6e2f3}
.tips li{margin:0 0 9px}
.tips b{font-weight:600;color:#fff}
.credits{text-align:center}
.credits h3{margin:18px 0 4px;font-family:var(--display);font-weight:400;font-size:13px;letter-spacing:4px;color:var(--glow)}
.credits p{margin:2px 0;font-size:18px;color:#d6e2f3}
.stat{display:flex;align-items:baseline;justify-content:center;gap:12px;margin:6px 0 18px}
.stat b{font-family:var(--display);font-weight:400;font-size:44px;letter-spacing:4px;color:#fff;text-shadow:0 0 22px rgba(120,190,255,.55)}
.stat i{font-size:18px;color:var(--mute)}

/* ── logros ───────────────────────── */
.achtop{display:flex;align-items:center;gap:18px;margin:0 0 12px}
.achtop .num{font-family:var(--display);font-size:30px;letter-spacing:2px;color:#fff;text-shadow:0 0 16px rgba(120,190,255,.5)}
.achtop .num small{font-size:13px;letter-spacing:2px;color:var(--mute);margin-left:6px}
.achtop .pts{font-family:var(--display);font-size:12px;letter-spacing:2px;color:var(--glow)}
.achbar{flex:1;height:6px;border-radius:3px;background:rgba(120,170,230,.12);overflow:hidden}
.achbar i{display:block;height:100%;background:linear-gradient(90deg,#2a6fd0,var(--glow));box-shadow:0 0 10px var(--glow)}
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ach{display:flex;gap:12px;align-items:center;padding:8px;border:1px solid rgba(140,180,230,.18);border-radius:2px;background:rgba(10,20,40,.35);min-height:74px;transition:all .18s}
.ach.sel{border-color:rgba(170,225,255,.85);background:rgba(70,150,240,.2);box-shadow:0 0 14px rgba(90,180,255,.25)}
.ach img,.ach .ph{flex:none;width:56px;height:56px;border:1px solid rgba(160,205,255,.35);background:#06102a}
.ach.lock img{opacity:.75;filter:saturate(.3)}
.ach .ph{display:grid;place-items:center;font-family:var(--display);color:var(--dim)}
.ach .tx{min-width:0;flex:1}
.ach b{display:block;font-family:var(--display);font-weight:400;font-size:12.5px;letter-spacing:1.2px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ach.lock b{color:#a9b9d0}
.ach i{display:block;font-size:14.5px;line-height:1.15;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ach .pt{flex:none;align-self:flex-start;font-family:var(--display);font-size:11px;color:var(--glow)}
.ach .ok{color:#9ff0c8}
.raform{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.raform p{margin:0;font-size:17.5px;line-height:1.4;color:#d6e2f3}
.raform input{height:40px;padding:0 14px;font:inherit;font-size:18px;color:#fff;background:rgba(6,14,32,.7);border:1px solid rgba(150,200,255,.4);border-radius:2px;outline:none}
.raform input:focus{border-color:rgba(190,230,255,.95);box-shadow:0 0 12px rgba(110,190,255,.45)}
.raform .msg{min-height:22px;font-size:16px;font-style:italic;color:var(--glow)}
.raform .msg.err{color:#ffb4a8}
.credits.roll{padding:10px 0 40px}
/* ── lanzamiento ───────────────────── */
#launch{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(ellipse at center,rgba(6,14,34,.96),rgba(1,3,10,1));opacity:0;pointer-events:none;transition:opacity 1.1s cubic-bezier(.45,0,.25,1)}
#launch.show{opacity:1;pointer-events:auto}
#launch.now,#veil.now{transition:none!important}
#launchT,#launchS{transition:opacity .9s ease .35s,transform 1.2s cubic-bezier(.2,.8,.2,1) .35s;opacity:0;transform:translateY(8px)}
#launch.show #launchT,#launch.show #launchS{opacity:1;transform:none}
#launchS{transition-delay:.6s}
/* fundido a negro entre el launcher y el juego (en los dos sentidos) */
#veil{position:fixed;inset:0;z-index:90;background:#000;opacity:0;pointer-events:none;transition:opacity .8s cubic-bezier(.45,0,.55,1)}
#veil.on{opacity:1;pointer-events:auto}
#veil.slow{transition-duration:1.1s}
#moon{position:relative;width:190px;height:190px}
#moon svg{position:absolute;inset:0}
#moon .disc{position:absolute;inset:28px;border-radius:50%;background:radial-gradient(circle at 38% 36%,#f4f9ff,#bcd6f2 55%,#7ea2cc);box-shadow:0 0 60px 14px rgba(150,205,255,.45)}
#moon .shadow{position:absolute;inset:28px;border-radius:50%;overflow:hidden}
#moon .shadow i{position:absolute;inset:0;border-radius:50%;background:#030817;transform:translateX(0);transition:transform 2.6s cubic-bezier(.4,0,.2,1)}
#launch.show #moon .shadow i{transform:translateX(105%)}
#launchT{font-family:var(--display);font-size:22px;letter-spacing:8px;color:#fff;text-shadow:0 0 18px rgba(120,190,255,.6)}
#launchS{font-size:19px;font-style:italic;color:var(--mute);min-height:24px}

/* ── diálogo / aviso ───────────────── */
#dim{position:absolute;inset:0;z-index:35;background:rgba(1,4,12,.6);opacity:0;pointer-events:none;transition:opacity .25s}
#dlg{position:absolute;left:50%;top:50%;z-index:36;width:460px;padding:26px 30px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.8,.2,1);
  background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6)}
body.dlg #dim{opacity:1;pointer-events:auto} body.dlg #dlg{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
#dlg h3{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:6px}
#dlg p{margin:0 0 20px;font-size:18px;font-style:italic;color:var(--mute)}
#dlg .btns{display:flex;gap:14px;justify-content:center}
#dlg .pbtn{min-width:130px;justify-content:center;height:40px}
#toast{position:absolute;left:50%;top:20px;z-index:40;transform:translate(-50%,-10px);padding:9px 24px;background:var(--glass);border:1px solid var(--line);font-size:18px;opacity:0;transition:all .3s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fade{position:absolute;inset:0;z-index:70;background:#000;opacity:0;pointer-events:none;transition:opacity .9s ease-in}
body.closing #fade{opacity:1;pointer-events:auto}
body.infoot .mi.sel .band,body.infoot .mi.sel .lotus{opacity:.25}
#intro{position:absolute;inset:0;z-index:45;background:#000;display:grid;place-items:center;transition:opacity 1.2s ease}
#intro.gone{opacity:0;pointer-events:none}
#intro p{font-family:var(--display);font-size:15px;letter-spacing:10px;color:#9fc6ee;opacity:0;animation:introTxt 3s ease forwards .4s}
@keyframes introTxt{0%{opacity:0;letter-spacing:4px}40%{opacity:1}100%{opacity:0;letter-spacing:14px}}
/* cursor propio: luz de luciérnaga (como el puntero del juego) */
html,body,#stage{cursor:-webkit-image-set(url(assets/cursor.png) 1x,url(assets/cursor@2x.png) 2x) 16 16,default}
button,.mi,.tab,.opt,.track,.bind,.pbtn,.iconbtn,.big,.item,[data-back]{cursor:-webkit-image-set(url(assets/cursor_on.png) 1x,url(assets/cursor_on@2x.png) 2x) 16 16,pointer}
body.nocur,body.nocur *{cursor:none!important}
</style>

  const loadImg = (src) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
  if (gl) {
    const VS = 'attribute vec2 p;varying vec2 uv;void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}';
    const FS = `precision mediump float;varying vec2 uv;uniform sampler2D bg;uniform sampler2D mk;uniform float t;
      void main(){
        float m=texture2D(mk,uv).r;
        float d=mix(.55,1.35,uv.y);                       // perspectiva: ondas más finas al fondo
        vec2 o;
        o.x=sin(uv.y*240./d+t*1.6+sin(uv.x*18.+t*.45)*2.2)*.0012+sin(uv.x*85.+uv.y*160.-t*1.05)*.0006;
        o.y=cos(uv.x*110.+uv.y*35.+t*1.25)*.0010*d;
        vec4 c=texture2D(bg,uv+o*m);
        float l=dot(c.rgb,vec3(.299,.587,.114));
        float sp=smoothstep(.70,.96,l)*(.5+.5*sin(t*3.6+uv.x*640.+uv.y*1250.+sin(uv.y*90.+t)*3.))*m;
        c.rgb+=sp*.20*vec3(.82,.95,1.);
        c.rgb+=m*.035*vec3(.55,.82,1.)*(.5+.5*sin(uv.x*26.-t*.55+sin(uv.y*22.+t*.35)*1.6));
        gl_FragColor=vec4(c.rgb,1.);
      }`;
    const sh = (type, src) => { const x = gl.createShader(type); gl.shaderSource(x, src); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
    try {
      glProg = gl.createProgram(); gl.attachShader(glProg, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(glProg, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(glProg); gl.useProgram(glProg);
      const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(glProg, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      const tex = (img, unit) => { const tx = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tx);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img); };
      Promise.all([loadImg('assets/bg.jpg'), loadImg('assets/anim/agua_mascara.png')]).then(([a, b]) => {
        tex(a, 0); tex(b, 1); gl.uniform1i(gl.getUniformLocation(glProg, 'bg'), 0); gl.uniform1i(gl.getUniformLocation(glProg, 'mk'), 1);
        glOk = true; requestAnimationFrame(glFrame);
      }).catch((e) => { console.warn('fondo vivo', e); glc.style.display = 'none'; });
    } catch (e) { console.warn('fondo vivo', e); glc.style.display = 'none'; }
  } else glc.style.display = 'none';
  const uT = () => gl.getUniformLocation(glProg, 't');
  let glStill = false;
  const glFrame = () => {
    const live = cfg.bgAnim === 'on' && !gameOn && !document.hidden;
    if (live || !glStill) {
      gl.viewport(0, 0, glc.width, glc.height);
      gl.uniform1f(uT(), live ? (performance.now() - glT0) / 1000 : 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); glStill = !live;
    }
    requestAnimationFrame(glFrame);
  };

  /* ───── luciérnagas y pétalos ───── */
  const cv = $('#fx'), cx = cv.getContext('2d'); const P = [];
  const spawn = (init) => {
    const petal = Math.random() < .22;
    P.push({ petal, x: petal ? 500 + Math.random() * 900 : Math.random() * 1280, y: init ? Math.random() * 720 : (petal ? -20 : 740),
      vx: petal ? -(.25 + Math.random() * .45) : (Math.random() - .5) * .25, vy: petal ? .3 + Math.random() * .4 : -(.12 + Math.random() * .3),
      r: petal ? 3 + Math.random() * 3.5 : .8 + Math.random() * 1.8, a: Math.random() * 6.28, va: (Math.random() - .5) * .04, ph: Math.random() * 6.28 });
  };
  for (let i = 0; i < 54; i++) spawn(true);
  const frame = () => {
    cx.clearRect(0, 0, 1280, 720);
    if (cfg.particles === 'on') {
      for (let i = P.length - 1; i >= 0; i--) {
        const p = P[i]; p.ph += .018; p.a += p.va; p.x += p.vx + Math.sin(p.ph) * .3; p.y += p.vy;
        if (p.y > 750 || p.y < -30 || p.x < -30 || p.x > 1310) { P.splice(i, 1); spawn(false); continue; }
        cx.save(); cx.translate(p.x, p.y);
        if (p.petal) {
          cx.rotate(p.a); cx.scale(1, .45 + Math.abs(Math.sin(p.ph)) * .55);
          cx.fillStyle = 'rgba(214,196,255,.55)'; cx.beginPath(); cx.ellipse(0, 0, p.r, p.r * .5, 0, 0, 6.28); cx.fill();
        } else {
          const fl = .35 + Math.sin(p.ph * 2.6) * .3;
          const g = cx.createRadialGradient(0, 0, 0, 0, 0, p.r * 6);
          g.addColorStop(0, `rgba(190,232,255,${Math.max(0, fl)})`); g.addColorStop(1, 'rgba(120,200,255,0)');
          cx.fillStyle = g; cx.beginPath(); cx.arc(0, 0, p.r * 6, 0, 6.28); cx.fill();
        }
        cx.restore();
      }
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);

  /* ───── mensajes del launcher ───── */
  if (host) host.addEventListener('message', (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.type === 'state') {
      const d = m.data || {}; st = d;
      cfg = Object.assign({}, DEF, d.config || {}); if (cfg.fpsMig !== 1) { cfg.fps60 = 'off'; cfg.fpsMig = 1; save(); } cfg.padBinds = cfg.padBinds || {}; cfg.kbBinds = cfg.kbBinds || {}; for (const k of Object.keys(cfg.kbBinds)) if (cfg.kbBinds[k] === 'ESCAPE') delete cfg.kbBinds[k];
      LG = d.logros || null; if (panel === 'ach') paintAch();
      document.body.classList.toggle('full', !!d.fullscreen);
      applyKey(); if (introOn === null) startIntro();
    }
    if (m.type === 'fullscreen') document.body.classList.toggle('full', !!m.data);
    if (m.type === 'gameStarted') {}
    if (m.type === 'gameReady') {                // el juego ya tiene ventana: fundir a negro y que el launcher se oculte
      const v = $('#veil'); v.classList.remove('slow'); v.classList.add('on');
      setTimeout(() => { if (gameOn) post('hideLauncher'); }, 850);
    }
    if (m.type === 'prepReturn') {               // volviendo del juego: todo en negro y sin rastro de la pantalla de inicio
      const v = $('#veil'), Lc = $('#launch');
      v.classList.add('now', 'on'); Lc.classList.add('now'); Lc.classList.remove('show'); $('#launchS').textContent = '';
      void v.offsetWidth; v.classList.remove('now'); Lc.classList.remove('now');
    }
    if (m.type === 'gameClosed') onClosed(m.data);
    if (m.type === 'cfgPatch') Object.assign(cfg, m.data || {});
    if (m.type === 'raProgress') { const e = $('#raMsg'), d = m.data || {}; if (e) e.textContent = d.step === 'login' ? L().raLogin : d.step === 'set' ? L().raSet : L().raBadges.replace('{0}', d.done).replace('{1}', d.total); }
    if (m.type === 'raDone') { raBusy = false; if (!m.data.ok) { const e = $('#raMsg'); if (e) { e.className = 'msg err'; e.textContent = L().raFail.replace('{0}', m.data.error || '?'); } const g = $('#raGo'); if (g) g.disabled = false; sfx('back'); } else sfx('start'); }
    if (m.type === 'logro') { if (LG) { LG.unlocked = LG.unlocked || {}; LG.unlocked[m.data.id] = m.data.date; } if (panel === 'ach') paintAch(); }
    if (m.type === 'error') { onClosed(); toast(String(m.data || 'Error')); sfx('back'); }
  });

  /* ───── intro ───── */
  let introOn = null, introT;
  const intro = $('#intro');
  const showAll = () => { document.body.classList.add('ready'); syncMusic(); };
  const endIntro = () => { if (!introOn) return; introOn = false; clearTimeout(introT); intro.classList.add('gone'); showAll(); };
  const startIntro = () => {
    if (cfg.intro === 'on' && !/nointro/.test(location.hash)) { introOn = true; introT = setTimeout(endIntro, 3200); }
    else { introOn = false; intro.classList.add('gone'); intro.style.transition = 'none'; showAll(); }
  };
  intro.addEventListener('click', () => endIntro());
  addEventListener('click', () => { audio(); if (musicOk && cfg.music === 'on' && music.paused && !gameOn) syncMusic(); }, { once: true });

  buildMenu(); applyKey();
  if (host) post('init'); else { startIntro(); }
  window.__fd = { input, cfg, openPanel, closePanel, launch };
})();
</script>
